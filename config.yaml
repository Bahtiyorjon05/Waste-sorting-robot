# =============================================================================
# EcoSort AI - Configuration
# =============================================================================
# The Raspberry Pi runs everything. Your laptop is just a browser pointed at
#   http://<raspberry-pi-ip>:8000
# Find the Pi's IP with:  hostname -I
# =============================================================================

# ---------------------------------------------------------------------------
# Backends
# ---------------------------------------------------------------------------
# "auto"  -> use the real hardware if its library is present, otherwise fall
#            back to simulation. This is what lets the SAME code run on your
#            Windows laptop (simulation) and on the Pi (real hardware).
CAMERA_BACKEND: "auto"     # auto | picamera2 | opencv | simulation
SERVO_BACKEND:  "auto"     # auto | gpio | arduino | simulation
SENSOR_BACKEND: "auto"     # auto | gpio | simulation

# ---------------------------------------------------------------------------
# Web dashboard
# ---------------------------------------------------------------------------
WEB_HOST: "0.0.0.0"        # 0.0.0.0 = reachable from the laptop over WiFi/LAN
WEB_PORT: 8000

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
CAMERA_INDEX: 0            # used by the "opencv" backend (USB webcam index)
FRAME_WIDTH: 640
FRAME_HEIGHT: 480
TARGET_FPS: 12             # how fast the Sense-Think-Act loop / live feed runs

# ---------------------------------------------------------------------------
# YOLO model
# ---------------------------------------------------------------------------
# MODEL_PATH options:
#   "yolov8n.pt"  -> standard YOLOv8, auto-downloads (~6 MB) on first run.
#                    Detects everyday objects -- use it to test REAL detection
#                    with your webcam before you train a dedicated waste model.
#   "edge_ai/weights/yolov8n_waste.pt" -> your own trained waste model.
MODEL_PATH: "yolov8n.pt"
CONFIDENCE_THRESHOLD: 0.50
IOU_THRESHOLD: 0.45
# YOLO inference image size. Smaller = much faster on a Pi CPU.
#   320 -> ~3-4x faster than 640, small accuracy trade-off (recommended for Pi 4)
#   640 -> highest accuracy, ~1 FPS on a Pi 4
YOLO_IMGSZ: 320

# CLASS_MAP: the model's class NAME  ->  EcoSort label (PLASTIC or PAPER).
# The defaults below work with the standard yolov8n.pt model, so you can hold
# real objects in front of the camera straight away:
#   show a plastic bottle / cup -> PLASTIC -> tilt LEFT
#   show a book                 -> PAPER   -> tilt RIGHT
CLASS_MAP:
  bottle: PLASTIC
  cup: PLASTIC
  wine glass: PLASTIC
  book: PAPER
  # After you train your own waste model, replace the lines above with its
  # class names, for example:
  #   plastic: PLASTIC
  #   paper: PAPER

# ---------------------------------------------------------------------------
# Simulation (used by any backend set to "simulation", or "auto" with no HW)
# ---------------------------------------------------------------------------
SIMULATED_DETECTION_LABEL: ""          # "" = alternate PLASTIC/PAPER; or pin one
SIMULATED_DETECTION_INTERVAL_SEC: 4.0  # seconds between fake detections
SIMULATED_BIN_DISTANCE_CM: 30.0        # set < BIN_FULL_THRESHOLD_CM to test pause

# ---------------------------------------------------------------------------
# Tilting servo (ONE servo tilts the platform left or right)
# ---------------------------------------------------------------------------
SERVO_GPIO: 17             # Pi BCM pin (used by the "gpio" backend)
SERVO_TILT_LEFT: -0.8      # gpiozero Servo value for PLASTIC  (range -1..1)
SERVO_FLAT: 0.0            # resting / level position
SERVO_TILT_RIGHT: 0.8      # gpiozero Servo value for PAPER
SERVO_HOLD_SEC: 2.0        # hold the tilt this long, then return to flat
SERVO_MIN_PULSE_WIDTH: 0.0005
SERVO_MAX_PULSE_WIDTH: 0.0025

# ---------------------------------------------------------------------------
# Arduino servo backend (only used when SERVO_BACKEND is "arduino")
# Flash hardware/arduino/ecosort_servo.ino to the Arduino first.
# ---------------------------------------------------------------------------
ARDUINO_PORT: "/dev/ttyUSB0"   # on Windows this looks like "COM3"
ARDUINO_BAUD: 9600

# ---------------------------------------------------------------------------
# Bin monitor (HC-SR04 ultrasonic sensor)
# ---------------------------------------------------------------------------
TRIG_GPIO: 23
ECHO_GPIO: 24
BIN_FULL_THRESHOLD_CM: 8.0     # closer than this = bin full, pause sorting
BIN_POLL_INTERVAL_SEC: 3.0
BIN_MAX_DISTANCE_M: 1.0

# ---------------------------------------------------------------------------
# Database & logging
# ---------------------------------------------------------------------------
DATABASE_URL: "sqlite:///ecosort.db"
FEEDBACK_IMAGE_DIR: "edge_ai/feedback_images"   # 👎 images saved here

# ---------------------------------------------------------------------------
# Loop behaviour
# ---------------------------------------------------------------------------
COOLDOWN_SEC: 3.0          # minimum gap between two consecutive sorts
