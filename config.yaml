# =============================================================================
# Waste Sorting Pod - Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Simulation Settings
# ---------------------------------------------------------------------------
# Set USE_SIMULATION to true when running on WSL2/Windows without GPIO hardware.
# When true, the system uses simulated sensor readings and skips real GPIO calls.
USE_SIMULATION: true

# Label to simulate when USE_SIMULATION is true.
# Set to one of: Plastic, Paper, Metal, or "" (empty = no detections).
SIMULATED_DETECTION_LABEL: ""

# How often (seconds) the simulator generates a fake detection event.
SIMULATED_DETECTION_INTERVAL_SEC: 5.0

# Simulated ultrasonic distance in cm (set < 5.0 to trigger bin-full pause).
SIMULATED_BIN_DISTANCE_CM: 100.0

# ---------------------------------------------------------------------------
# YOLO Model
# ---------------------------------------------------------------------------
MODEL_PATH: "models/yolov8n_waste.pt"
CONFIDENCE_THRESHOLD: 0.50
IOU_THRESHOLD: 0.45

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
CAMERA_INDEX: 0
FRAME_WIDTH: 640
FRAME_HEIGHT: 480

# ---------------------------------------------------------------------------
# LED Array (forward-facing illumination)
# ---------------------------------------------------------------------------
LED_GPIO: 22

# ---------------------------------------------------------------------------
# Servo Configuration (MG996R)
# ---------------------------------------------------------------------------
LEFT_SERVO_GPIO: 17
RIGHT_SERVO_GPIO: 27
SERVO_SWEEP_ANGLE_DEG: 90.0
SERVO_HOLD_SEC: 1.0
SERVO_MIN_PULSE_WIDTH: 0.0005
SERVO_MAX_PULSE_WIDTH: 0.0025

# ---------------------------------------------------------------------------
# Bin Monitor (HC-SR04 Ultrasonic Sensor)
# ---------------------------------------------------------------------------
TRIG_GPIO: 23
ECHO_GPIO: 24
BIN_FULL_THRESHOLD_CM: 5.0
BIN_POLL_INTERVAL_SEC: 5.0
BIN_MAX_DISTANCE_M: 1.0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
LOG_FILE: "sort_log.csv"

# ---------------------------------------------------------------------------
# IBM Watson IoT / MQTT (optional async upload)
# ---------------------------------------------------------------------------
MQTT_ENABLED: false
MQTT_HOST: ""
MQTT_PORT: 8883
MQTT_TOPIC: "iot-2/evt/sort/fmt/json"
MQTT_CLIENT_ID: ""
MQTT_USERNAME: ""
MQTT_PASSWORD: ""
MQTT_USE_TLS: true
